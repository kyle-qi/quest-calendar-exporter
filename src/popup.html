<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Quest Calendar Exporter</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 320px; margin: 0; padding: 14px 16px;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p  { margin: 6px 0; line-height: 1.4; }
    ol { margin: 6px 0 10px 18px; padding: 0; }
    button {
      width: 100%; padding: 9px 12px; font: 600 14px inherit;
      background: #fed136; color: #1a1a1a; border: 1px solid #b8860b;
      border-radius: 6px; cursor: pointer;
    }
    button[disabled] { opacity: 0.5; cursor: not-allowed; }
    #status { margin: 10px 0 6px; min-height: 20px; }
    .ok  { color: #137333; }
    .err { color: #b00020; }
    .hint { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h1>uWaterloo Quest Calendar Exporter</h1>
  <ol>
    <li>Open <b>Quest &rarr; Academics &rarr; Enroll &rarr; My Class Schedule</b></li>
    <li>Switch to <b>List View</b></li>
    <li>Click the button below (or the floating button on the page)</li>
  </ol>
  <div id="status" class="hint">Checking page&hellip;</div>
  <button id="dl" disabled>Download .ics</button>
  <p class="hint">Tip: import the .ics into Google Calendar, Apple Calendar, or Outlook.</p>
  <script src="ical.js"></script>
  <script src="popup.js"></script>
</body>
</html>
